apiVersion: v1
kind: Namespace
metadata:
  name: myspace
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: myspace
spec:
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
        - name: flask-app
          image: shubhamm18/jenkins-k8s:latest
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: flask-service
  namespace: myspace
spec:
  type: NodePort
  selector:
    app: flask
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30050

