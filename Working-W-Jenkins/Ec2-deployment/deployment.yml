apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: myspace
spec:
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: myapp
          image: shubhamm18/jenkins-k8s:latest
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: myapp-service
  namespace: myspace
spec:
  type: LoadBalancer
  selector:
    app: myapp
  ports:
    - port: 5000
      targetPort: 5000


